<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>This page shows you the addition result</title>

	<style>

		*{
			margin:0;
			padding:0;
			box-sizing:border-box;
		}

		body{
			height:100vh;
			display:flex;
			justify-content:center;
			align-items:center;
			font-family:Arial, sans-serif;
			background:linear-gradient(135deg,#74ebd5,#ACB6E5);
		}

		.container{
			width:380px;
			background:white;
			padding:35px;
			border-radius:15px;
			box-shadow:0px 8px 25px rgba(0,0,0,0.2);
			transition:0.3s;
		}

		.container:hover{
			transform:scale(1.02);
		}

		h2{
			text-align:center;
			margin-bottom:20px;
			color:#333;
		}

		p{
			text-align:center;
			font-size:20px;
			margin-bottom:20px;
			color:#444;
		}

		span{
			color:#007BFF;
			font-weight:bold;
			font-size:24px;
		}

		hr{
			margin-bottom:20px;
			border:none;
			height:1px;
			background:#ddd;
		}

		label{
			font-weight:bold;
			color:#333;
			display:block;
			margin-bottom:8px;
			margin-top:15px;
		}

		input[type="text"]{
			width:100%;
			padding:12px;
			border:1px solid #ccc;
			border-radius:8px;
			font-size:15px;
			transition:0.3s;
		}

		input[type="text"]:focus{
			border-color:#007BFF;
			outline:none;
			box-shadow:0px 0px 8px rgba(0,123,255,0.4);
		}

		input[type="submit"]{
			width:100%;
			padding:12px;
			margin-top:25px;
			border:none;
			border-radius:8px;
			background:#007BFF;
			color:white;
			font-size:16px;
			font-weight:bold;
			cursor:pointer;
			transition:0.3s;
		}

		input[type="submit"]:hover{
			background:#0056b3;
		}

	</style>

</head>

<body>

	<div class="container">

		<h2>Addition Calculator</h2>

		<p>
			Addition Result is :
			<span th:text="${sum}"></span>
		</p>

		<hr>

		<form action="http://localhost:8080/api/addDigits" method="get">

			<label>Enter First Number :</label>
			<input type="text" name="a" required>

			<label>Enter Second Number :</label>
			<input type="text" name="b" required>

			<input type="submit" value="Calculate">

		</form>

	</div>

</body>

</html>
