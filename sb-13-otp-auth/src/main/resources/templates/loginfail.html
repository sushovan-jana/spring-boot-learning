<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Login</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .container{
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
            color: #243b55;
        }

        table{
            width: 100%;
        }

        td{
            padding: 10px 0;
        }

        label{
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"]{

            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus{

            border-color: #243b55;
            box-shadow: 0px 0px 8px rgba(36,59,85,0.5);
        }

        .btn{

            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #243b55;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover{

            background: #141e30;
            transform: scale(1.03);
        }

    </style>

</head>

<body>
	<h1>LOG IN FAIL, PLEASE TRY AGAIN LATER</h1>
    <div class="container">

        <h1>User Login</h1>

        <form action="http://localhost:8080/users/api/login" method="post">

            <table>

                <tr>
                    <td>
                        <label>USERNAME</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="text" 
                               name="username" 
                               placeholder="Enter username">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label>PASSWORD</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="password" 
                               name="password" 
                               placeholder="Enter password">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="submit" 
                               value="LOGIN" 
                               class="btn">
                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>

</html>
