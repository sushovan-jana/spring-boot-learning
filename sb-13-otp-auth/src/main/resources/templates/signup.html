<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Sign Up</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .container{
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
            color: #1e3c72;
        }

        table{
            width: 100%;
        }

        td{
            padding: 10px 0;
        }

        label{
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"]{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus{
            border-color: #2a5298;
            box-shadow: 0px 0px 8px rgba(42,82,152,0.5);
        }

        .btn{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1e3c72;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover{
            background: #2a5298;
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>User Sign Up</h1>

        <form action="http://localhost:8080/users/api/signup" method="post">

            <table>

                <tr>
                    <td><label>USERNAME</label></td>
                </tr>
                <tr>
                    <td>
                        <input type="text" name="username" placeholder="Enter username">
                    </td>
                </tr>

                <tr>
                    <td><label>PASSWORD</label></td>
                </tr>
                <tr>
                    <td>
                        <input type="password" name="password" placeholder="Enter password">
                    </td>
                </tr>

                <tr>
                    <td><label>EMAIL</label></td>
                </tr>
                <tr>
                    <td>
                        <input type="email" name="email" placeholder="Enter email">
                    </td>
                </tr>

                <tr>
                    <td><label>ROLE</label></td>
                </tr>
                <tr>
                    <td>
                        <input type="text" name="role" placeholder="Enter role">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="submit" value="SIGN UP" class="btn">
                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>
</html>
