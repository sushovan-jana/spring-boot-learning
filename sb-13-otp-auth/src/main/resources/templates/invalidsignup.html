<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Invalid Sign Up</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #8B0000, #B22222);
        }

        .container{
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.35);
        }

        .error-box{
            background: #ffe5e5;
            color: #b30000;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            border: 1px solid #ffb3b3;
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
            color: #8B0000;
        }

        table{
            width: 100%;
        }

        td{
            padding: 10px 0;
        }

        label{
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"]{

            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus{

            border-color: #B22222;
            box-shadow: 0px 0px 8px rgba(178,34,34,0.4);
        }

        .btn{

            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #8B0000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover{

            background: #B22222;
            transform: scale(1.03);
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="error-box">
            SIGN UP FAILED! PLEASE TRY AGAIN
        </div>

        <h1>User Sign Up</h1>

        <form action="http://localhost:8080/users/api/signup" method="post">

            <table>

                <tr>
                    <td><label>USERNAME</label></td>
                </tr>

                <tr>
                    <td>
                        <input type="text"
                               name="username"
                               placeholder="Enter username">
                    </td>
                </tr>

                <tr>
                    <td><label>PASSWORD</label></td>
                </tr>

                <tr>
                    <td>
                        <input type="password"
                               name="password"
                               placeholder="Enter password">
                    </td>
                </tr>

                <tr>
                    <td><label>EMAIL</label></td>
                </tr>

                <tr>
                    <td>
                        <input type="email"
                               name="email"
                               placeholder="Enter email">
                    </td>
                </tr>

                <tr>
                    <td><label>ROLE</label></td>
                </tr>

                <tr>
                    <td>
                        <input type="text"
                               name="role"
                               placeholder="Enter role">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="submit"
                               value="SIGN UP AGAIN"
                               class="btn">
                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>

</html>
