<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>This is a calculator project build with SpringBoot</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
        }

        .container{
            width:420px;
            background:white;
            padding:35px;
            border-radius:18px;
            box-shadow:0px 10px 30px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#1e3c72;
            font-size:30px;
        }

        label{
            display:block;
            margin-bottom:8px;
            margin-top:15px;
            font-weight:bold;
            color:#333;
        }

        input[type="number"]{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            transition:0.3s;
        }

        input[type="number"]:focus{
            border-color:#2a5298;
            outline:none;
            box-shadow:0px 0px 8px rgba(42,82,152,0.4);
        }

        .button-group{
            margin-top:25px;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        button{
            padding:12px;
            border:none;
            border-radius:10px;
            font-size:15px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
            color:white;
        }

        button:hover{
            transform:translateY(-2px);
        }

        .add{
            background:#28a745;
        }

        .sub{
            background:#dc3545;
        }

        .div{
            background:#fd7e14;
        }

        .mul{
            background:#007bff;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Calculator App</h1>

        <form action="http://localhost:8080/api/calculate" method="get">

            <label for="num1">Enter First Number</label>

            <input type="number" name="num1" required>

            <label for="num2">Enter Second Number</label>

            <input type="number" name="num2" required>

            <div class="button-group">

                <button type="submit" name="operation" value="ADD" class="add">
                    ADD
                </button>

                <button type="submit" name="operation" value="SUBTRACT" class="sub">
                    SUBTRACT
                </button>

                <button type="submit" name="operation" value="DIVISION" class="div">
                    DIVISION
                </button>

                <button type="submit" name="operation" value="MULTIPLICATION" class="mul">
                    MULTIPLICATION
                </button>

            </div>

        </form>

    </div>

</body>

</html>
