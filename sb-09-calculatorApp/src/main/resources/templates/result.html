<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>This is a calculator project build with SpringBoot</title>

	<style>

		*{
			margin:0;
			padding:0;
			box-sizing:border-box;
		}

		body{
			height:100vh;
			display:flex;
			justify-content:center;
			align-items:center;
			font-family:Arial, sans-serif;
			background:linear-gradient(135deg,#141e30,#243b55);
		}

		.container{
			width:450px;
			background:white;
			padding:35px;
			border-radius:20px;
			box-shadow:0px 10px 30px rgba(0,0,0,0.3);
			text-align:center;
		}

		h1{
			color:#243b55;
			margin-bottom:20px;
			font-size:32px;
		}

		.result-box{
			background:#f4f7fb;
			padding:20px;
			border-radius:12px;
			margin-bottom:25px;
			border-left:6px solid #007bff;
		}

		.result-box p{
			font-size:18px;
			color:#333;
			font-weight:bold;
			line-height:1.6;
		}

		.result-box span{
			color:#007bff;
			font-size:28px;
			font-weight:bold;
		}

		label{
			display:block;
			text-align:left;
			margin-top:15px;
			margin-bottom:8px;
			font-weight:bold;
			color:#333;
		}

		input[type="number"]{
			width:100%;
			padding:12px;
			border:1px solid #ccc;
			border-radius:10px;
			font-size:15px;
			transition:0.3s;
		}

		input[type="number"]:focus{
			outline:none;
			border-color:#007bff;
			box-shadow:0px 0px 8px rgba(0,123,255,0.3);
		}

		.button-group{
			margin-top:25px;
			display:grid;
			grid-template-columns:1fr 1fr;
			gap:15px;
		}

		button{
			padding:12px;
			border:none;
			border-radius:10px;
			color:white;
			font-size:15px;
			font-weight:bold;
			cursor:pointer;
			transition:0.3s;
		}

		button:hover{
			transform:translateY(-2px);
			opacity:0.9;
		}

		.add{
			background:#28a745;
		}

		.sub{
			background:#dc3545;
		}

		.div{
			background:#fd7e14;
		}

		.mul{
			background:#007bff;
		}

	</style>

</head>

<body>

	<div class="container">

		<h1>Calculator Result</h1>

		<div class="result-box">

			<p>
				THE CALCULATED RESULT BASED ON YOUR NEEDED OPERATION IS
			</p>

			<span th:text="${result}"></span>

		</div>

		<form action="http://localhost:8080/api/calculate" method="get">

			<label for="num1">Enter First Number</label>

			<input type="number" name="num1" required>

			<label for="num2">Enter Second Number</label>

			<input type="number" name="num2" required>

			<div class="button-group">

				<button type="submit" name="operation" value="ADD" class="add">
					ADD
				</button>

				<button type="submit" name="operation" value="SUBTRACT" class="sub">
					SUBTRACT
				</button>

				<button type="submit" name="operation" value="DIVISION" class="div">
					DIVISION
				</button>

				<button type="submit" name="operation" value="MULTIPLICATION" class="mul">
					MULTIPLICATION
				</button>

			</div>

		</form>

	</div>

</body>

</html>
